[project]
name = "ade-remediate"
version = "0.1.0"
description = "First-ADE autonomous self-remediation runner"
requires-python = ">=3.11"
dependencies = [
    "click>=8.3.2",
    "httpx>=0.27.0",
    "gitpython>=3.1.50",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
local-llm = [
    "llama-cpp-python>=0.2.89",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["remediate"]
