name: ADE axioms

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  axioms:
    name: First-ADE axiom validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: First-ADE/.github/.github/actions/ade-axioms@b5258c030d1341753a7d902ab85d1649795f567e # main, 2026-11-07 (First-ADE/.github#32 merged)
