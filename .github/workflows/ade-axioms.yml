name: ADE axioms

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ade-axioms-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  axioms:
    name: First-ADE axiom validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: First-ADE/.github/.github/actions/ade-axioms@827bf315869e11ff2052fe5596c1fc6da5c006ea # main
