name: ADE axioms

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  axioms:
    name: First-ADE axiom validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: First-ADE/.github/.github/actions/ade-axioms@f9d037010cbc1c9342b292adc6c31d1ea2e0c283 # First-ADE/.github#32 head, 2026-11-06; re-pin to a main SHA after merge
