name: First-ADE Self-Improvement Loop

on:
  schedule:
    - cron: '19 2 * * 1'
  workflow_dispatch:

concurrency:
  group: self-improvement-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Cache LLM Model File
        id: cache-model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/first-ade/
          key: qwen-1.5b-gguf-v1

      - name: Install Project Dependencies
        run: |
          uv sync --locked --no-build

      - name: Run Autonomous Remediation (Local CPU LLM)
        run: |
          uv run --locked --no-build python cli/remediate.py

      - name: Verify Fix
        run: |
          uv run --locked --no-build ade-compliance check-all src/

      - name: Create Pull Request for Remediation Changes
        if: success()
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.7
        with:
          commit-message: "chore(compliance): autonomous compliance remediation"
          title: "chore(compliance): autonomous compliance remediation"
          body: "Automated compliance remediation generated by the First-ADE Self-Improvement Loop."
          branch: chore/autonomous-compliance-remediation
          delete-branch: true
